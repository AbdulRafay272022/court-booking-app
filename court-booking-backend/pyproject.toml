[project]
name = "court-booking-backend"
version = "0.1.0"
description = "Backend API for the court booking platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43",  # bank_details app-level encryption
    "httpx[http2]>=0.27",  # http2: APNs only speaks HTTP/2 (app/services/apns.py)
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=10.4",
    "imagehash>=4.3",
    "geoalchemy2>=0.15",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.14",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",  # password hashing (Section 26); NOT Fernet, which is reversible
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx",
    "factory-boy>=3.3",
    "faker>=30.0",
    "ruff>=0.7",
    "mypy>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
