<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin:0; font-family:'Figtree','Segoe UI',system-ui,sans-serif; }
    a { color:#EF5A2C; } a:hover { color:#C8431C; }
    * { box-sizing:border-box; }</style></head><body><div style="display:flex; flex-direction:column; height:844px;">

    <div style="padding:20px 20px 14px; background:#FFFFFF; border-bottom:1px solid #EBE5E1; display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:44px; height:44px; border-radius:12px; background:#F4EFEC; display:flex; align-items:center; justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141A1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </div>
        <div style="display:flex; flex-direction:column; gap:2px; flex-grow:1;">
          <div style="font-size:18px; font-weight:700; letter-spacing:-0.02em;">Padel Republic</div>
          <div style="font-size:13px; color:#7A7068; font-weight:500;">DHA Phase 6 · 2.4 km away</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <div style="padding:0 15px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#141A1D; color:#FFFFFF; font-size:13.5px; font-weight:600;">Court 1</div>
        <div style="padding:0 15px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#F4EFEC; color:#5C544D; font-size:13.5px; font-weight:600;">Court 2</div>
        <div style="padding:0 15px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#F4EFEC; color:#5C544D; font-size:13.5px; font-weight:600;">Court 3</div>
      </div>
    </div>

    <div style="display:flex; gap:8px; padding:14px 20px; background:#FFFFFF; border-bottom:1px solid #EBE5E1; overflow:hidden;">
      <div style="min-width:52px; padding:9px 0; border-radius:12px; background:#EF5A2C; color:#FFFFFF; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span style="font-size:10px; font-weight:600; letter-spacing:0.06em; opacity:0.85;">TUE</span>
        <span style="font-size:17px; font-weight:700; font-family:'IBM Plex Mono',monospace;">08</span>
      </div>
      <div style="min-width:52px; padding:9px 0; border-radius:12px; background:#F4EFEC; color:#5C544D; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span style="font-size:10px; font-weight:600; letter-spacing:0.06em;">WED</span>
        <span style="font-size:17px; font-weight:700; font-family:'IBM Plex Mono',monospace;">09</span>
      </div>
      <div style="min-width:52px; padding:9px 0; border-radius:12px; background:#F4EFEC; color:#5C544D; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span style="font-size:10px; font-weight:600; letter-spacing:0.06em;">THU</span>
        <span style="font-size:17px; font-weight:700; font-family:'IBM Plex Mono',monospace;">10</span>
      </div>
      <div style="min-width:52px; padding:9px 0; border-radius:12px; background:#F4EFEC; color:#5C544D; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span style="font-size:10px; font-weight:600; letter-spacing:0.06em;">FRI</span>
        <span style="font-size:17px; font-weight:700; font-family:'IBM Plex Mono',monospace;">11</span>
      </div>
      <div style="min-width:52px; padding:9px 0; border-radius:12px; background:#F4EFEC; color:#5C544D; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span style="font-size:10px; font-weight:600; letter-spacing:0.06em;">SAT</span>
        <span style="font-size:17px; font-weight:700; font-family:'IBM Plex Mono',monospace;">12</span>
      </div>
    </div>

    <div style="flex-grow:1; overflow:hidden; padding:16px 20px 0; display:flex; flex-direction:column; gap:9px;">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
        <div onClick="{{ s.pick }}" style="{{ s.rowStyle }}">
          <div style="display:flex; flex-direction:column; gap:3px;">
            <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; letter-spacing:-0.01em;">{{ s.time }}</span>
            <span style="font-size:11.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:{{ s.metaColor }};">{{ s.meta }}</span>
          </div>
          <div style="display:flex; align-items:center; gap:11px;">
            <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:{{ s.priceColor }};">{{ s.price }}</span>
            <div style="{{ s.chipStyle }}">{{ s.chip }}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding:14px 20px 22px; background:#FFFFFF; border-top:1px solid #EBE5E1;">
      <div style="font-size:12.5px; color:#7A7068; font-weight:500; text-align:center;">Tap any open slot to book it</div>
    </div>
  </div></body></html>
