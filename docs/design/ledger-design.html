<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khelo Owner Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: account book. Position strip → venue money rules → period statement (booking basis + cash bridge) → tabs (Bookings / Payment history / Players / To do) → inline drill-down per row. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#F7F9F8; --ink:#15201D; --muted:#56635E; --line:#E0E6E3;
  --accent:#0E7C6B; --accent-ink:#0B5E52; --accent-soft:#E2F2EE; --brand:#E8590C;
  --in:#0B6B3A; --in-soft:#E3F4EA; --out:#A3261B; --out-soft:#FBE9E7;
  --adj:#5A3E9B; --adj-soft:#EFEAFB; --warn:#7A4F00; --warn-soft:#FDF3DE;
  --info:#1F4E8C; --info-soft:#E7EFFA; --grey-soft:#EEF1EF;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#161F1C; --sunk:#1B2522; --ink:#E5ECE9; --muted:#9BA8A3; --line:#28332F;
  --accent:#3DBFA6; --accent-ink:#86DCCB; --accent-soft:#143A33; --brand:#FF8A4C;
  --in:#6FD39A; --in-soft:#15321F; --out:#F28B80; --out-soft:#3B1916;
  --adj:#BBA8F2; --adj-soft:#2A2142; --warn:#F2C46B; --warn-soft:#3A2D10;
  --info:#93B8EF; --info-soft:#172A45; --grey-soft:#222C29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161F1C; --sunk:#1B2522; --ink:#E5ECE9; --muted:#9BA8A3; --line:#28332F;
  --accent:#3DBFA6; --accent-ink:#86DCCB; --accent-soft:#143A33; --brand:#FF8A4C;
  --in:#6FD39A; --in-soft:#15321F; --out:#F28B80; --out-soft:#3B1916;
  --adj:#BBA8F2; --adj-soft:#2A2142; --warn:#F2C46B; --warn-soft:#3A2D10;
  --info:#93B8EF; --info-soft:#172A45; --grey-soft:#222C29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.shell{display:flex;flex-wrap:wrap;min-height:100vh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{flex:1 1 220px;max-width:260px;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.side .who{font-size:12px;color:var(--muted);padding:4px 8px 16px}
.side a{text-decoration:none;color:var(--muted);padding:11px 12px;border-radius:10px;font-size:14px}
.side a:hover{background:var(--sunk);color:var(--ink)}
.side a[aria-current="page"]{color:#fff;background:var(--accent);font-weight:700}
.side .wordmark{font-size:26px;font-weight:800;letter-spacing:-.5px}
.wrap{flex:999 1 560px;min-width:0;max-width:1180px;padding-left:max(16px,40px);padding-right:max(16px,40px);padding-block:32px 48px;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .side{max-width:none;flex-basis:100%;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));gap:6px}
  .side .who,.side .brandrow{display:none}
  .side a{white-space:nowrap;padding:8px 12px}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.sample{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13px}
.sample strong{font-weight:800;letter-spacing:.3px}
header.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex-shrink:0}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.role{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;border-radius:999px;padding:8px 14px;min-height:38px;font-size:13px;font-weight:600;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--accent);color:#fff}
.position{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pos{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
button.pos:hover{border-color:var(--accent)}
.pos .k{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.pos .v{font-size:24px;font-weight:800;letter-spacing:-.4px}
.pos.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pos.warn .k,.pos.warn .s{color:var(--warn)}
.pos .s{font-size:12px;color:var(--muted)}
.pos.warn .v{color:var(--warn)} .pos.out .v{color:var(--out)} .pos.info .v{color:var(--info)}
.seclabel{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.seclabel h2{margin:0;font-size:18px;font-weight:800}
.seclabel span{font-size:12.5px;color:var(--muted)}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;font-size:13px}
.rules .rk{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.rules select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-height:36px;font-size:13px;max-width:100%}
.period{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:44px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 4px 0 12px;min-height:44px;font-size:13px;color:var(--muted);max-width:100%}
label.sel select,label.sel input{border:0;background:transparent;font-weight:700;color:var(--ink);min-height:42px;padding:0 6px;font-size:14px;min-width:0;max-width:100%}
.period{gap:8px}
.statement{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.eq,.split{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.eqb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;flex:1 1 150px}
button.eqb:hover{border-color:var(--accent)}
.eqb .k{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.eqb .v{font-size:18px;font-weight:800}
.eqb .s{font-size:11.5px;color:var(--muted)}
.op{align-self:center;font-weight:800;color:var(--muted);font-size:18px;padding:0 2px}
.eqb.final{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.eqb.final .v{color:var(--accent-ink)}
.eqb.adj .v{color:var(--adj)} .eqb.in .v{color:var(--in)} .eqb.warn .v{color:var(--warn)} .eqb.out .v{color:var(--out)}
.bridge{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.bridge strong{color:var(--ink)}
details.months summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent-ink);min-height:32px;display:flex;align-items:center}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;min-height:44px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--out-soft);color:var(--out);font-size:11.5px;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-height:42px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;min-height:42px;font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:42px;font-size:13.5px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 40%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.statuschips{display:flex;flex-wrap:wrap;gap:6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:13.5px}
.list>.row:first-child,.list>div:first-child>.row{border-top:0}
button.row:hover{background:var(--sunk)}
.row.head{background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.bk{grid-template-columns:86px minmax(150px,1.3fr) minmax(120px,1fr) repeat(4,minmax(78px,.7fr)) 160px}
.tx{grid-template-columns:96px 130px minmax(150px,1.2fr) minmax(120px,1fr) 80px minmax(110px,.9fr) 96px}
.pl{grid-template-columns:minmax(150px,1.4fr) 70px repeat(4,minmax(90px,.8fr)) 120px}
.num{text-align:right}
.cell2{display:flex;flex-direction:column;gap:1px;min-width:0}
.cell2 small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-paid{background:var(--in-soft);color:var(--in)} .p-partial,.p-unpaid{background:var(--warn-soft);color:var(--warn)}
.p-refund{background:var(--out-soft);color:var(--out)} .p-adv,.p-pending{background:var(--info-soft);color:var(--info)}
.p-cancel,.p-noshow{background:var(--grey-soft);color:var(--muted)}
.t-in{color:var(--in);font-weight:700} .t-out{color:var(--out);font-weight:700} .t-adj{color:var(--adj);font-weight:700} .t-grey{color:var(--muted);font-weight:700} .t-info{color:var(--info);font-weight:700}
.k-chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700}
.k-in{background:var(--in-soft);color:var(--in)} .k-out{background:var(--out-soft);color:var(--out)} .k-adj{background:var(--adj-soft);color:var(--adj)} .k-grey{background:var(--grey-soft);color:var(--muted)} .k-fix{background:var(--warn-soft);color:var(--warn)} .k-info{background:var(--info-soft);color:var(--info)}
.flag{font-size:11px;font-weight:700;color:var(--out)}
.mob{display:none}
.more{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line)}
.detail{background:var(--sunk);border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
.detail h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.calc .ln{display:flex;justify-content:space-between;gap:10px}
.calc .ln span:first-child{min-width:0}
.calc .tot{border-top:1px dashed var(--line);padding-top:6px;font-weight:800}
.calc .result{margin-top:4px;border-radius:8px;padding:8px 10px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.formula{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tli{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.tl>.tli:first-child{border-top:0}
.tli .meta{font-size:11.5px;color:var(--muted)}
.tli.ev{background:var(--sunk);color:var(--muted)}
.tli.rev .body{opacity:.6;text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.form{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.form .fields{display:flex;flex-wrap:wrap;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);flex:1 1 140px;min-width:0}
.form input,.form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;font-size:14px;font-weight:500;width:100%}
.msg{font-size:12.5px;border-radius:8px;padding:8px 10px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.info{background:var(--info-soft);color:var(--info)} .msg.ok{background:var(--in-soft);color:var(--in)}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding:12px 14px;border-top:2px solid var(--line);background:var(--sunk);font-size:13px}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task h3{margin:0;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.task .ti{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:13px;min-height:44px}
.task h3+.ti{border-top:0}
button.ti:hover{background:var(--sunk)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);z-index:20}
.note{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .bk,.tx,.pl{grid-template-columns:minmax(0,1fr) auto}
  .row.head{display:none}
  .dsk{display:none}
  .mob{display:flex}
  .detail{grid-template-columns:1fr}
  .tli{grid-template-columns:74px minmax(0,1fr) auto}
}
</style>

<script>
(function(){
'use strict';
var TODAY='2026-11-10',NOW_H=12;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function addDays(s,n){var d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dow(s){return new Date(s+'T00:00:00Z').getUTCDay();}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);}
function fd(s,yr){if(!s)return '';var p=s.split('-');var t=(+p[2])+' '+MONTHS[+p[1]-1];return (yr||p[0]!=='2026')?t+' '+p[0]:t;}
function rs(n){return 'Rs '+Math.abs(Math.round(n)).toLocaleString('en-IN');}
function sg(n){return (n<0?'−':'+')+rs(n);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hr(h){if(h>=24)return (h-24===0?12:h-24)+':00 AM';var ap=h>=12?'PM':'AM';return (h%12||12)+':00 '+ap;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=mulberry(20261110);
function pick(a){return a[Math.floor(R()*a.length)];}

function calc(b){
  var c={price:b.price,disc:0,ns:0,cx:0,pf:0,paid:0,ref:0,tocr:0,fromcr:0,waive:0};
  (byB[b.key]||[]).forEach(function(e){var k=e.kind;
    if(k==='discount')c.disc+=e.amt;else if(k==='noshow')c.ns+=e.amt;else if(k==='cancel')c.cx+=e.amt;else if(k==='pricefix')c.pf+=e.amt;
    else if(k==='waiver')c.waive+=e.amt;else if(k==='refund')c.ref+=-e.amt;else if(k==='tocredit')c.tocr+=-e.amt;
    else if(PAYIN[k]){c.paid+=e.amt;if(k==='fromcredit')c.fromcr+=e.amt;}});

}

function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function submitForm(form){
  var b=B[form.getAttribute('data-fkey')],c=calc(b),t=st.form.type;
  var v=function(id){var el=form.querySelector('#'+id);return el?el.value.trim():'';};
  var amt=Math.round(Number((v('f-amt')||'0').replace(/[, ]/g,'')));
  var err=function(x){st.formMsg=['err',x];renderPanel();};
  var add=function(kind,a,d,o){var e=addE(b,kind,a,d,o);e.edate=TODAY;ENTRY[e.id]=e;return e;};
  if(t!=='reverse'&&t!=='cancel'&&(!amt||amt<=0))return err('Enter an amount above 0.');
  if(t==='pay'){
    var m=v('f-method'),d=v('f-date'),note=v('f-note'),extra=amt-c.bal;
    if(d>TODAY)return err('A payment cannot be recorded on a future day.');
    if(d<TODAY&&!note)return err('Earlier day ('+fd(d)+'): add a note. The entry is made today and shows the money as received on '+fd(d)+'.');
    var kind=b.date<d&&c.payable?'due':(b.status==='upcoming'||d<b.date)?'adv':'bal';
    add(kind,amt,d,{method:m,by:v('f-by'),time:nowTime(),note:note||(kind==='due'?'Old due paid · linked by booking ID':'')+(extra>0?' · '+rs(extra)+' more than balance':'')});
    if(extra>0&&v('f-extra')==='credit')add('tocredit',-extra,d,{by:'Hamza',time:nowTime(),note:'Extra kept as player credit'});
    var c2=calc(b);toast(rs(amt)+' linked to '+b.id+'. Status: '+c2.st[1]+(extra>0?(v('f-extra')==='credit'?' · '+rs(extra)+' added to player credit':' · '+rs(extra)+' shown as refund due'):'')+'.');
  }else if(t==='usecredit'){
    var pc=playerCredit(b.player);if(amt>pc)return err('Player has only '+rs(pc)+' credit.');if(amt>c.bal)return err('More than the balance ('+rs(c.bal)+').');
    add('fromcredit',amt,TODAY,{method:'credit',by:'Hamza',time:nowTime(),note:'Player credit used'});toast(rs(amt)+' credit used on '+b.id+'.');
  }else if(t==='refund'){
    if(amt>c.refund)return err('Refund '+rs(amt)+' is more than the refund due ('+rs(c.refund)+'). To give more back, first use "Reduce price" with a reason.');
    var ref=ENTRY[v('f-ref')];if(!ref)return err('Pick the payment being returned.');
    add('refund',-amt,v('f-date'),{method:v('f-method'),by:'Hamza',ref:ref.id,time:nowTime(),note:'Refund recorded'});toast(rs(amt)+' refund recorded against '+ref.id+'. '+b.id+': '+calc(b).st[1]+'.');
  }else if(t==='tocredit'){
    if(amt>c.refund)return err('Only '+rs(c.refund)+' is due back.');
    add('tocredit',-amt,TODAY,{by:'Hamza',time:nowTime(),note:v('f-note')||'Kept as player credit'});toast(rs(amt)+' moved to '+b.player+'\'s credit.');
  }else if(t==='cancel'){
    var by=v('f-by2'),hrs=dayDiff(TODAY,b.date)*24+(b.hour-NOW_H),full=by==='venue'||hrs>=RULES.cancelHours;
    var adjA=full?-c.final:-Math.max(c.bal,0);
    b.status='cancelled';b.cancelBy=by;b.cancelledOn=TODAY;
    add('cancel',adjA,TODAY,{by:'System',time:nowTime(),note:by==='venue'?'Venue cancelled: always full refund':full?'Cancelled '+hrs+' hours before: full refund (venue rule: 24+ hours)':'Cancelled '+hrs+' hours before: advance kept, rest not charged (venue rule: under 24 hours)'});
    var c3=calc(b);toast(b.id+' cancelled. '+(c3.refund?rs(c3.refund)+' is now refund due.':'Advance kept, nothing due.'));
  }else if(t==='pricefix'){
    var n2=v('f-note');if(!n2)return err('A reason is required.');if(amt>c.final)return err('Cannot reduce by more than the final amount ('+rs(c.final)+').');
    add('pricefix',-amt,TODAY,{by:'Hamza',note:n2,time:nowTime()});var c4=calc(b);toast('Final amount is now '+rs(c4.final)+'.'+(c4.refund?' Refund due: '+rs(c4.refund)+'.':''));
  }else if(t==='waive'){
    var n3=v('f-note');if(!n3)return err('A reason is required.');if(amt>c.due)return err('Cannot waive more than the due ('+rs(c.due)+').');
    add('waiver',amt,TODAY,{by:'Hamza',note:n3,time:nowTime()});toast(rs(amt)+' waived. '+b.id+': '+calc(b).st[1]+'.');
  }else if(t==='reverse'){
    var n4=v('f-note'),r=ENTRY[v('f-ref')];if(!n4)return err('A reason is required.');if(!r)return err('Pick an entry.');
    add('reversal',-r.amt,TODAY,{by:'Hamza',ref:r.id,note:n4,time:nowTime(),method:r.method});r.reversed=true;toast(r.id+' reversed. '+b.id+': '+calc(b).st[1]+'.');
  }
  st.form=null;st.formMsg=null;renderAll();
}
function act(b,a){
  var c=calc(b);
  if(a==='played'){b.status='played';toast(b.id+' marked played. '+(calc(b).due?rs(calc(b).due)+' is now due.':'Settled.'));}
  else if(a==='noshow'){b.status='no_show';b.markedBy=st.role==='owner'?'Hamza':'Ali';
    if(RULES.noshow==='advance'&&c.bal>0){var e=addE(b,'noshow',-c.bal,TODAY,{by:'System',time:nowTime(),note:noshowText()+' · marked by '+b.markedBy});ENTRY[e.id]=e;}
    toast(b.id+' marked no-show. '+(RULES.noshow==='advance'?'Advance kept, rest not charged. Player and owner notified.':rs(calc(b).due)+' is now due. Player and owner notified.'));}
  else if(a==='undonoshow'){b.status='played';var ns=(byB[b.key]||[]).reduce(function(s,e){return e.kind==='noshow'?s+e.amt:s;},0);
    if(ns){var e2=addE(b,'noshow',-ns,TODAY,{by:'Hamza',time:nowTime(),note:'No-show undone: player was here'});ENTRY[e2.id]=e2;}
    toast(b.id+' changed to played. '+(calc(b).due?rs(calc(b).due)+' is now due.':'Settled.'));}
  renderAll();
}

/* ---------- render + events ---------- */
function renderPanel(){var p=$('panel');p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+st.tab);
  p.innerHTML=st.tab==='bookings'?renderBookings():st.tab==='history'?renderHistory():st.tab==='players'?renderPlayers():renderTasks();
  var q=$('q');if(q&&st._focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);st._focusQ=false;}}
function renderAll(){renderPosition();renderPeriod();renderStatement();renderTabs();renderPanel();}
var tt;function toast(x){var t=$('toast');t.textContent=x;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},4500);}
function csv(kind){
  var rows=[];
  if(kind==='bookings'){rows.push(['Booking','Slot day','Time','Court','Player','Phone','Booking amount','Deductions','Final','Received','Waived','Balance','Status']);
    periodSet().filter(function(b){return qMatch(b)&&bkMatch(b,calc(b));}).forEach(function(b){var c=calc(b);rows.push([b.id,b.date,b.time,COURTS[b.court].name,b.player,b.phone,b.price,c.adj,c.final,c.net,c.waive,c.bal,c.st[1]]);});}
  else{rows.push(['Entry','Money day','Entered','Type','Booking','Slot day','Player','Method','Person','Amount','Linked entry','Note']);
    histList().forEach(function(e){var b=B[e.b];rows.push([e.id,e.mdate,e.edate,KL[e.kind],b.id,b.date,b.player,e.method,e.by,e.amt,e.ref||'',e.note]);});}
  return rows.map(function(r){return r.map(function(x){x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\n');
}
function copy(text,label){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(label+' copied.');},function(){fallbackCopy(text,label);});}else fallbackCopy(text,label);
}
function fallbackCopy(text,label){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('aria-label',label);ta.style.cssText='width:100%;height:160px';$('panel').prepend(ta);ta.select();toast('Could not copy automatically. The text is selected above: copy it yourself.');}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.id==='role-owner'||t.id==='role-staff'){st.role=t.id==='role-owner'?'owner':'staff';$('role-owner').setAttribute('aria-pressed',String(st.role==='owner'));$('role-staff').setAttribute('aria-pressed',String(st.role==='staff'));st.form=null;renderPanel();return;}
  var a;
  if((a=t.getAttribute('data-preset'))){st.preset=a;setRange();st.page=40;renderAll();return;}
  if(t.hasAttribute('data-bkf')){st.bkFilter=t.getAttribute('data-bkf');st.tab='bookings';st.page=40;try{localStorage.setItem('khelo-ledger-tab',st.tab);}catch(e){}renderTabs();renderPanel();if(t.classList.contains('eqb'))$('tabs').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if((a=t.getAttribute('data-tab'))||(a=t.getAttribute('data-goto'))){st.tab=a;st.page=40;st.form=null;if(a==='players')st.plSort='due';try{localStorage.setItem('khelo-ledger-tab',a);}catch(e){}renderTabs();renderPanel();if(t.hasAttribute('data-goto'))$('tabs').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if((a=t.getAttribute('data-open'))){st.open=st.open===a?null:a;st.form=null;st.formMsg=null;renderPanel();return;}
  if((a=t.getAttribute('data-jump'))){var b=B[a];st.tab='bookings';st.open=a;st.q=b.id;st.bkFilter='';st.form=null;
    if(!inRange(b.date)){st.preset='all';setRange();}try{localStorage.setItem('khelo-ledger-tab','bookings');}catch(e){}renderAll();
    var el=document.querySelector('[data-open="'+a+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if((a=t.getAttribute('data-form'))){if(t.disabled)return;st.form={key:st.open,type:a};st.formMsg=null;renderPanel();return;}
  if((a=t.getAttribute('data-act'))){if(t.disabled)return;act(B[st.open],a);return;}
  if(t.hasAttribute('data-cancel')){st.form=null;st.formMsg=null;renderPanel();return;}
  if(t.hasAttribute('data-more')){st.page+=40;renderPanel();return;}
  if((a=t.getAttribute('data-pl'))){st.plOpen=st.plOpen===a?null:a;st.formMsg=null;renderPanel();return;}
  if((a=t.getAttribute('data-copy'))){copy(csv(a),'CSV');return;}
  if((a=t.getAttribute('data-stmt'))){copy(statementText(a),'Account');return;}
});
document.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target;if(f.hasAttribute('data-fkey'))submitForm(f);else if(f.hasAttribute('data-plpay'))submitPlayerPay(f);});
document.addEventListener('input',function(ev){var t=ev.target;if(t.id==='q'){st.q=t.value;st.page=40;st._focusQ=true;renderPanel();}});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.id==='from'||t.id==='to'){if(!t.value)return;st[t.id]=t.value;st.preset='custom';if(st.from>st.to){var x=st.from;st.from=st.to;st.to=x;}renderAll();}
  else if(t.id==='court'){st.court=t.value;renderAll();}
  else if(t.id==='preset'){st.preset=t.value;if(t.value!=='custom')setRange();st.page=40;renderAll();}
  else if(t.id==='bkf'){st.bkFilter=t.value;st.page=40;renderPanel();}
  else if(t.id==='r-noshow'){RULES.noshow=t.value;toast('No-show rule changed. Already-marked bookings keep the rule they were marked with.');}
  else if(t.id==='txKinds'||t.id==='txMethod'||t.id==='txBy'||t.id==='plSort'){st[t.id]=t.value;renderPanel();}
});
renderAll();
})();
</script>
