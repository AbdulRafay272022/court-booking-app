name: Build, push, deploy

# !!! A PUSH TO MAIN THAT CONTAINS A DATABASE MIGRATION RUNS IT ON PRODUCTION !!!
# deploy/remote-deploy.sh runs `alembic upgrade head` from the new image before the new backend starts. The
# `migration-guard` job fails the run (nothing deploys) if any migration file changed since the last successful deploy,
# unless a commit in that range has a line that is exactly 'Migration-Go: owner-approved'. Take a DB backup first:
#   sudo /opt/court-booking/db-backup.sh
#
# Every push to main: build backend + web images -> ECR, then SSM Run Command on the AFTR web-server EC2
# (13.233.73.99) runs deploy/remote-deploy.sh from this commit. Keyless: GitHub OIDC -> IAM role, no secrets in GitHub.
# App secrets live in SSM Parameter Store under /court-booking-app/ (see deploy/server-env.sh).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::545908811041:role/github-actions-court-booking-deploy
  INSTANCE_ID: i-0fe1dd19adfb072d6
  # Baked into the web image's browser bundle at build time (NEXT_PUBLIC_*).
  API_BASE_URL: https://api.khelo.13.233.73.99.sslip.io

jobs:
  migration-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an unapproved migration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['head_sha'] if r else '')" || true)"
          if [ -z "$BASE" ]; then BASE="$EVENT_BEFORE"; fi
          echo "checking migrations since the last successful deploy: ${BASE:-none} -> $SHA"
          bash infra/scripts/check-migration-guard.sh "$BASE" "$SHA"

  # Copies the app's keys from this repo's Actions variables into SSM Parameter Store, where
  # deploy/server-env.sh reads them. Only names in the list below are copied; values are never printed.
  sync-config:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actions variables -> SSM /court-booking-app/secrets/*
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          KEYS="ANTHROPIC_API_KEY GEMINI_API_KEY OPENAI_API_KEY WHATSAPP_API_TOKEN WHATSAPP_PHONE_NUMBER_ID
            WHATSAPP_APP_SECRET WHATSAPP_WEBHOOK_VERIFY_TOKEN FCM_SERVICE_ACCOUNT_KEY APNS_KEY APNS_KEY_ID APNS_TEAM_ID
            WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_PUBLIC_KEY WEB_PUSH_VAPID_SUBJECT CNIC_HASH_KEY SENTRY_DSN
            PLATFORM_BANK_NAME PLATFORM_ACCOUNT_TITLE PLATFORM_ACCOUNT_NUMBER PLATFORM_IBAN
            BANK_DETAILS_ENCRYPTION_KEY BANK_DETAILS_ENCRYPTION_KEYS_OLD SESSION_TOKEN_SECRET"
          echo "Actions variables present: $(echo "$VARS_JSON" | jq -r 'keys | join(" ")')"
          synced=""
          for k in $KEYS; do
            v="$(jq -rn --arg k "$k" --argjson v "$VARS_JSON" '$v[$k] // ""')"
            [ -n "$v" ] || continue
            echo "::add-mask::$v"
            cur="$(aws ssm get-parameter --name "/court-booking-app/secrets/$k" --with-decryption --query Parameter.Value --output text 2>/dev/null || true)"
            if [ "$cur" != "$v" ]; then
              aws ssm put-parameter --name "/court-booking-app/secrets/$k" --type SecureString --tier Intelligent-Tiering \
                --overwrite --value "$v" >/dev/null
              synced="$synced $k"
            fi
          done
          echo "updated in SSM:${synced:- (nothing changed)}"

  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: court-booking-backend
          file: court-booking-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          # npm workspaces monorepo: context is the frontend workspace root (see apps/web/Dockerfile).
          context: court-booking-frontend
          file: court-booking-frontend/apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.API_BASE_URL }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-web:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [build-and-push, migration-guard, sync-config]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 (SSM Run Command)
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          set -euo pipefail
          # AWS-RunShellScript uses /bin/sh; fetch the real script and run it with bash.
          CMD="curl -fsSL ${RAW}/deploy/remote-deploy.sh -o /tmp/court-booking-deploy.sh && IMAGE_TAG=${IMAGE_TAG} RAW=${RAW} bash /tmp/court-booking-deploy.sh"
          PARAMS="$(jq -n --arg c "$CMD" '{commands: [$c]}')"
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "court-booking deploy ${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --timeout-seconds 1200 \
            --query Command.CommandId --output text)"
          echo "SSM command: $CMD_ID"
          for _ in $(seq 1 120); do   # up to ~20 min
            sleep 10
            RES="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" 2>/dev/null || echo '{"Status":"Pending"}')"
            case "$(echo "$RES" | jq -r .Status)" in Pending|InProgress|Delayed) continue;; *) break;; esac
          done
          echo "$RES" | jq -r .StandardOutputContent
          echo "$RES" | jq -r .StandardErrorContent
          STATUS="$(echo "$RES" | jq -r .Status)"
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
