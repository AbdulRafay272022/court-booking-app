<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<title>Khelo Owner · Aur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0C1F1D}
a{color:#0E7C74}a:hover{color:#0A5F59}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1480px; background: #F4F6F5; position: relative; overflow: hidden; font-variant-numeric: tabular-nums">

  <div style="position: relative; background: linear-gradient(165deg, #0E7C74 0%, #0A5F59 55%, #0C1F1D 100%); padding: 52px 16px 46px 16px; overflow: hidden">
    <div style="position: absolute; width: 280px; height: 280px; border-radius: 140px; background: #0E7C74; opacity: 0.5; filter: blur(70px); top: -100px; left: -60px"></div>
    <div style="position: absolute; width: 200px; height: 200px; border-radius: 100px; background: #3DDC97; opacity: 0.22; filter: blur(70px); top: 60px; right: -80px"></div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; color: #FFFFFF">Aur</h1>
      <div style="display: flex; align-items: center; gap: 12px; border-radius: 22px; padding: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); color: #FFFFFF">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #0C1F1D; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex: none">DO</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <span style="font-size: 17px; font-weight: 700">Demo Owner</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.78)">Demo Arena · Owner</span>
        </div>
        <button style="flex: none; height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; color: #0C1F1D; border: 0; font-size: 13px; font-weight: 700; cursor: pointer">Profile</button>
      </div>
    </div>
  </div>

  <div style="position: relative; margin-top: -24px; background: #F4F6F5; border-radius: 30px 30px 0 0; padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #4A5D5A; padding-left: 4px">{{g.title}}</span>
        <div style="background: #FFFFFF; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(15,26,29,0.05)">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="#" style="{{r.rowStyle}}">
              <span style="width: 40px; height: 40px; border-radius: 13px; background: {{r.tile}}; color: {{r.iconColor}}; display: flex; align-items: center; justify-content: center; flex: none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <span style="font-size: 15px; font-weight: 600; color: #0C1F1D">{{r.label}}</span>
                <span style="font-size: 12px; color: #4A5D5A">{{r.sub}}</span>
              </span>
              <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}">
                <span style="{{r.badgeStyle}}">{{r.badge}}</span>
              </sc-if>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6E6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 10px 26px rgba(15,26,29,0.05)">
      <span style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: #E3F4F1; color: #0A5F59; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
        </span>
        <span style="font-size: 15px; font-weight: 600">Zabaan</span>
      </span>
      <div style="display: flex; gap: 3px; background: #F4F6F5; padding: 3px; border-radius: 12px">
        <button aria-pressed="true" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: #0E7C74; font-size: 13px; font-weight: 700; color: #FFFFFF; cursor: pointer">Roman Urdu</button>
        <button aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; font-size: 13px; font-weight: 600; color: #3B4B48; cursor: pointer">English</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 50px; border-radius: 16px; background: #FFFFFF; border: 0; color: #0C1F1D; font-size: 14px; font-weight: 700; cursor: pointer">Help · WhatsApp</button>
      <button style="height: 50px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F0C3BD; color: #B42318; font-size: 14px; font-weight: 700; cursor: pointer">Logout</button>
    </div>
  </div>

  <nav aria-label="Owner" style="position: absolute; left: 14px; right: 14px; bottom: 22px; height: 72px; border-radius: 26px; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 14px 36px rgba(15,26,29,0.18); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px; box-sizing: border-box">
    <a href="OwnerToday.dc.html" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: #3B4B48">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Aaj
    </a>
    <a href="Approvals.dc.html" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: #3B4B48">
      <span style="position: relative; display: flex">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span style="position: absolute; top: -5px; right: -10px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF6A2B; color: #0C1F1D; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
      </span>Approvals
    </a>
    <div style="display: flex; justify-content: center">
      <button aria-label="Add walk-in booking" style="width: 52px; height: 52px; border-radius: 18px; background: #0E7C74; color: #FFFFFF; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 18px rgba(14,124,116,0.4)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <a href="#" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: #3B4B48">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"></path><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"></path><circle cx="16" cy="14.5" r="1.2"></circle></svg>Paisa
    </a>
    <a href="#" style="height: 58px; border-radius: 20px; background: #0E7C74; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>Aur
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      history: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2',
      scan: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16',
      ledger: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      refund: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',
      premium: 'M3 8l4 4 5-7 5 7 4-4-2 11H5z',
      venue: 'M4 9 5 4h14l1 5M4 9a2.7 2.7 0 0 0 5.3 0a2.7 2.7 0 0 0 5.4 0a2.7 2.7 0 0 0 5.3 0M5 11v9h14v-9',
      courts: 'M3 5h18v14H3zM12 5v14M3 12h18',
      timer: 'M12 5a8 8 0 1 0 0 16a8 8 0 1 0 0-16zM12 9v4l2 2M9 2h6',
      cnic: 'M3 5h18v14H3zM15 10h3M15 14h3M6 16a3 3 0 0 1 6 0M9 9a2 2 0 1 0 0 4a2 2 0 1 0 0-4',
      staff: 'M9 4.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8',
      growth: 'M3 17l6-6 4 4 8-8M15 7h6v6',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
      megaphone: 'M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6',
      bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0'
    };
    const tiles = {
      teal: { tile: '#E3F4F1', iconColor: '#0E7C74' },
      green: { tile: '#DFF5EA', iconColor: '#0B6B43' },
      amber: { tile: '#FFF1D6', iconColor: '#8A5A00' },
      red: { tile: '#FDE8E5', iconColor: '#B42318' }
    };
    const badge = (kind) => {
      const base = 'flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; ';
      if (kind === 'amber') return base + 'background: #FFF1D6; color: #8A5A00;';
      if (kind === 'red') return base + 'background: #FF6A2B; color: #0C1F1D;';
      if (kind === 'new') return base + 'background: #0E7C74; color: #FFFFFF;';
      return base + 'background: #F4F6F5; color: #3B4B48;';
    };
    const mk = (title, rows) => ({
      title,
      rows: rows.map((r, i) => ({
        ...r,
        ...tiles[r.tone || 'teal'],
        hasBadge: !!r.badge,
        badgeStyle: badge(r.badgeKind),
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 62px; box-sizing: border-box; text-decoration: none; ' +
          (i < rows.length - 1 ? 'border-bottom: 1px solid #F4F6F5;' : '')
      }))
    });
    return {
      groups: [
        mk('BOOKINGS', [
          { icon: I.history, label: 'Bookings history', sub: 'Search, filters, CSV export' },
          { icon: I.scan, label: 'Check-in', sub: 'Player ka QR scan karein' }
        ]),
        mk('PAISA', [
          { icon: I.ledger, label: 'Ledger', sub: 'Har payment ka hisaab', tone: 'green' },
          { icon: I.refund, label: 'Refunds', sub: 'Players ko wapas dene hain', tone: 'red', badge: '1', badgeKind: 'red' },
          { icon: I.premium, label: 'Premium features', sub: 'Auto-approve, OCR, growth', tone: 'amber' }
        ]),
        mk('VENUE', [
          { icon: I.venue, label: 'Venue details', sub: 'Naam, address, photos, bank' },
          { icon: I.courts, label: 'Courts aur pricing', sub: 'Peak rates, hours, blackouts' },
          { icon: I.timer, label: 'Timers aur reminders', sub: 'Hold, auto-cancel, reminders' },
          { icon: I.cnic, label: 'Shanakht (CNIC)', sub: 'Payout ke liye zaroori', tone: 'amber', badge: 'Baqi', badgeKind: 'amber' }
        ]),
        mk('TEAM AUR GROWTH', [
          { icon: I.staff, label: 'Staff', sub: '2 members · permissions', badge: '2', badgeKind: 'gray' },
          { icon: I.growth, label: 'Growth suggestions', sub: 'Khaali slots bharne ke tareeqe', tone: 'green' },
          { icon: I.star, label: 'Reviews', sub: '4.0 · 1 review' },
          { icon: I.megaphone, label: 'Announcements', sub: 'Tournament ya offer bhejein', badge: 'New', badgeKind: 'new' },
          { icon: I.bell, label: 'Notifications', sub: 'Push, WhatsApp, daily summary' }
        ])
      ]
    };
  }
}
</script>
</body>
</html>
