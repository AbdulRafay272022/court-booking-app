<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin:0; font-family:'Figtree','Segoe UI',system-ui,sans-serif; }
    a { color:#EF5A2C; } a:hover { color:#C8431C; }
    * { box-sizing:border-box; }</style></head><body><div style="display:flex; flex-direction:column; height:844px; background:#0F2D22;">

    <div style="flex-grow:1; padding:44px 24px 0; display:flex; flex-direction:column; align-items:center; gap:22px;">
      <div style="width:66px; height:66px; border-radius:999px; background:#1F7A52; display:flex; align-items:center; justify-content:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:7px;">
        <div style="font-size:26px; font-weight:800; color:#FFFFFF; letter-spacing:-0.02em;">Court is yours</div>
        <div style="font-size:14.5px; color:#9BC4B1; font-weight:500; text-align:center;">Approved by the venue in 42 seconds</div>
      </div>

      <div style="width:100%; background:#FFFFFF; border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:18px;">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span style="font-size:19px; font-weight:700; letter-spacing:-0.01em;">Padel Republic · Court 1</span>
          <span style="font-size:14px; color:#7A7068; font-weight:500;">Tuesday 8 September · DHA Phase 6</span>
        </div>

        <div style="display:flex; gap:0;">
          <div style="flex-grow:1; display:flex; flex-direction:column; gap:3px;">
            <span style="font-size:10.5px; font-weight:700; letter-spacing:0.1em; color:#9A9791;">TIME</span>
            <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;">{{ slot.time }}</span>
          </div>
          <div style="flex-grow:1; display:flex; flex-direction:column; gap:3px;">
            <span style="font-size:10.5px; font-weight:700; letter-spacing:0.1em; color:#9A9791;">PAID</span>
            <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;">{{ slot.advance }}</span>
          </div>
          <div style="flex-grow:1; display:flex; flex-direction:column; gap:3px;">
            <span style="font-size:10.5px; font-weight:700; letter-spacing:0.1em; color:#9A9791;">AT VENUE</span>
            <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;">{{ slot.balance }}</span>
          </div>
        </div>

        <div style="height:1px; background:#F0EBE7;"></div>

        <div style="display:flex; align-items:center; gap:16px;">
          <div style="width:82px; height:82px; border-radius:12px; background:#141A1D; display:flex; align-items:center; justify-content:center;">
            <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
              <rect x="4" y="4" width="14" height="14" rx="2" stroke="#FFFFFF" stroke-width="3"></rect>
              <rect x="34" y="4" width="14" height="14" rx="2" stroke="#FFFFFF" stroke-width="3"></rect>
              <rect x="4" y="34" width="14" height="14" rx="2" stroke="#FFFFFF" stroke-width="3"></rect>
              <rect x="26" y="26" width="6" height="6" fill="#FFFFFF"></rect>
              <rect x="38" y="26" width="6" height="6" fill="#FFFFFF"></rect>
              <rect x="26" y="38" width="6" height="6" fill="#FFFFFF"></rect>
              <rect x="42" y="38" width="6" height="6" fill="#FFFFFF"></rect>
              <rect x="26" y="10" width="4" height="4" fill="#FFFFFF"></rect>
              <rect x="10" y="26" width="4" height="4" fill="#FFFFFF"></rect>
            </svg>
          </div>
          <div style="display:flex; flex-direction:column; gap:4px; flex-grow:1;">
            <span style="font-size:14.5px; font-weight:700;">Show this at the gate</span>
            <span style="font-size:13px; color:#7A7068; font-weight:500; line-height:1.45;">The venue scans it to check you in</span>
          </div>
        </div>
      </div>

      <div style="width:100%; height:50px; border-radius:14px; border:1px solid #2E5A48; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BC4B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-4-1L3 21l2.1-5a8.4 8.4 0 01-1-4 8.5 8.5 0 018.5-8.4 8.4 8.4 0 018.4 8.4z"></path></svg>
        <span style="font-size:14.5px; font-weight:600; color:#9BC4B1;">Share to your group</span>
      </div>
    </div>

    <div style="padding:18px 24px 26px;">
      <div onClick="{{ restart }}" style="height:52px; border-radius:14px; background:#FFFFFF; color:#141A1D; display:flex; align-items:center; justify-content:center; font-size:15.5px; font-weight:700; cursor:pointer;">Done</div>
    </div>
  </div></body></html>
