<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin:0; font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; }
    a { color:#0E6274; } a:hover { color:#0A4A58; }
    * { box-sizing:border-box; }</style></head><body><div style="width:390px; height:844px; background:#F4F6F7; color:#101C21; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:20px 18px; background:#FFFFFF; border-bottom:1px solid #DCE3E6; display:flex; align-items:center; gap:12px;">
    <div style="width:44px; height:44px; border-radius:10px; background:#F4F6F7; display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#101C21" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="display:flex; flex-direction:column; gap:2px; flex-grow:1;">
      <span style="font-size:16.5px; font-weight:700; letter-spacing:-0.01em;">Add a booking</span>
      <span style="font-size:12.5px; color:#8399A1; font-weight:500;">Walk-in, phone call or regular</span>
    </div>
  </div>

  <div style="flex-grow:1; overflow:hidden; padding:18px 18px 0; display:flex; flex-direction:column; gap:17px;">

    <div style="display:flex; flex-direction:column; gap:9px;">
      <span style="font-size:10.5px; font-weight:600; letter-spacing:0.1em; color:#8399A1;">COURT</span>
      <div style="display:flex; gap:8px;">
        <div style="flex-grow:1; min-height:46px; border-radius:10px; background:#0E6274; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">Court 1</div>
        <div style="flex-grow:1; min-height:46px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; color:#5B7079; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">Court 2</div>
        <div style="flex-grow:1; min-height:46px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; color:#5B7079; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">Court 3</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:9px;">
      <span style="font-size:10.5px; font-weight:600; letter-spacing:0.1em; color:#8399A1;">TIME · TUESDAY 8 SEP</span>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <div style="min-height:46px; padding:0 15px; border-radius:10px; background:#EFF2F3; color:#A6B6BC; display:flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; text-decoration:line-through;">16:00</div>
        <div style="min-height:46px; padding:0 15px; border-radius:10px; background:#EFF2F3; color:#A6B6BC; display:flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; text-decoration:line-through;">18:00</div>
        <div style="min-height:46px; padding:0 15px; border-radius:10px; background:#0E6274; color:#FFFFFF; display:flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600;">20:00</div>
        <div style="min-height:46px; padding:0 15px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; display:flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600;">22:00</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:9px;">
      <span style="font-size:10.5px; font-weight:600; letter-spacing:0.1em; color:#8399A1;">WHO</span>
      <div style="min-height:50px; padding:0 15px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; display:flex; align-items:center; gap:11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8399A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0116 0"></path></svg>
        <span style="font-size:14.5px; font-weight:500;">Usman Tariq</span>
      </div>
      <div style="min-height:50px; padding:0 15px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; display:flex; align-items:center; gap:11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8399A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"></path></svg>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:500;">0333 5119042</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:9px;">
      <span style="font-size:10.5px; font-weight:600; letter-spacing:0.1em; color:#8399A1;">PAYMENT</span>
      <div style="display:flex; gap:8px;">
        <div style="flex-grow:1; min-height:46px; border-radius:10px; background:#0E6274; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">Cash at gate</div>
        <div style="flex-grow:1; min-height:46px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; color:#5B7079; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">Already paid</div>
      </div>
      <div style="min-height:50px; padding:0 15px; border-radius:10px; background:#FFFFFF; border:1px solid #DCE3E6; display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:14px; color:#5B7079; font-weight:500;">Amount</span>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;">PKR 4,000</span>
      </div>
    </div>

    <div style="background:#FFFFFF; border:1px solid #DCE3E6; border-radius:10px; padding:14px; display:flex; align-items:center; gap:11px;">
      <div style="width:34px; height:20px; border-radius:999px; background:#0E6274; padding:2px; display:flex; justify-content:flex-end;">
        <div style="width:16px; height:16px; border-radius:999px; background:#FFFFFF;"></div>
      </div>
      <span style="font-size:13px; color:#5B7079; font-weight:500; line-height:1.4;">Close this slot on the app straight away</span>
    </div>
  </div>

  <div style="padding:15px 18px 24px; background:#FFFFFF; border-top:1px solid #DCE3E6;">
    <div style="height:54px; border-radius:11px; background:#0E6274; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:15.5px; font-weight:600;">Save booking</div>
  </div>
</div></body></html>
