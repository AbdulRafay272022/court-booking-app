<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin:0; font-family:'Figtree','Segoe UI',system-ui,sans-serif; }
    a { color:#EF5A2C; } a:hover { color:#C8431C; }
    * { box-sizing:border-box; }</style></head><body><div style="width:390px; height:844px; background:#FAF8F6; color:#141A1D; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:26px 26px 0; display:flex; flex-direction:column; gap:20px;">
    <div style="display:flex; gap:6px;">
      <div style="flex-grow:1; height:4px; border-radius:999px; background:#EF5A2C;"></div>
      <div style="flex-grow:1; height:4px; border-radius:999px; background:#EF5A2C;"></div>
      <div style="flex-grow:1; height:4px; border-radius:999px; background:#E5DED8;"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:9px;">
      <span style="font-size:27px; font-weight:800; letter-spacing:-0.032em;">Almost done</span>
      <span style="font-size:15.5px; color:#5C544D; font-weight:500; line-height:1.5;">Venues see your name when you book, so use the one you'd give at the gate.</span>
    </div>
  </div>

  <div style="flex-grow:1; padding:26px 26px 0; display:flex; flex-direction:column; gap:22px;">

    <div style="display:flex; flex-direction:column; gap:10px;">
      <span style="font-size:11px; font-weight:700; letter-spacing:0.11em; color:#9A9791;">YOUR NAME</span>
      <div style="height:56px; padding:0 16px; border-radius:14px; background:#FFFFFF; border:1.5px solid #141A1D; display:flex; align-items:center;">
        <span style="font-size:16px; font-weight:600;">Bilal Ahmed</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <span style="font-size:11px; font-weight:700; letter-spacing:0.11em; color:#9A9791;">WHERE YOU USUALLY PLAY</span>
      <div style="height:56px; padding:0 16px; border-radius:14px; background:#FFFFFF; border:1px solid #E5DED8; display:flex; align-items:center; gap:11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span style="font-size:16px; font-weight:600; flex-grow:1;">DHA Phase 6, Karachi</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:11px;">
      <span style="font-size:11px; font-weight:700; letter-spacing:0.11em; color:#9A9791;">SPORTS YOU PLAY</span>
      <div style="display:flex; flex-wrap:wrap; gap:9px;">
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; gap:7px; border-radius:999px; background:#141A1D; color:#FFFFFF; font-size:14px; font-weight:700;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
          Padel
        </div>
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; gap:7px; border-radius:999px; background:#141A1D; color:#FFFFFF; font-size:14px; font-weight:700;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
          Futsal
        </div>
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#FFFFFF; border:1px solid #E5DED8; color:#5C544D; font-size:14px; font-weight:600;">Cricket</div>
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#FFFFFF; border:1px solid #E5DED8; color:#5C544D; font-size:14px; font-weight:600;">Tennis</div>
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#FFFFFF; border:1px solid #E5DED8; color:#5C544D; font-size:14px; font-weight:600;">Badminton</div>
        <div style="padding:0 16px; min-height:44px; display:flex; align-items:center; border-radius:999px; background:#FFFFFF; border:1px solid #E5DED8; color:#5C544D; font-size:14px; font-weight:600;">Squash</div>
      </div>
    </div>

    <div style="background:#FFF3EE; border:1px solid #F6DCD1; border-radius:14px; padding:16px; display:flex; align-items:center; gap:13px;">
      <div style="width:38px; height:38px; border-radius:999px; background:#EF5A2C; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M10.5 21a2 2 0 003 0"></path></svg>
      </div>
      <span style="font-size:13.5px; color:#A65B3C; font-weight:600; line-height:1.45; flex-grow:1;">We'll tell you when a slot you wanted opens up. Nothing else.</span>
    </div>
  </div>

  <div style="padding:16px 26px 34px; background:#FFFFFF; border-top:1px solid #EBE5E1;">
    <div style="height:56px; border-radius:14px; background:#EF5A2C; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:16.5px; font-weight:700;">Start booking</div>
  </div>
</div></body></html>
