<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<title>Khelo Owner · Aaj</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0C1F1D}
a{color:#0E7C74}a:hover{color:#0A5F59}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1240px; background: #F4F6F5; position: relative; overflow: hidden; font-variant-numeric: tabular-nums">

  <div style="position: relative; background: linear-gradient(165deg, #0E7C74 0%, #0A5F59 55%, #0C1F1D 100%); padding: 52px 16px 50px 16px; overflow: hidden">
    <div style="position: absolute; width: 200px; height: 360px; border-radius: 100px; background: #FFFFFF; opacity: 0.12; filter: blur(46px); transform: rotate(32deg); top: -160px; left: -40px"></div>
    <div style="position: absolute; width: 200px; height: 360px; border-radius: 100px; background: #FFFFFF; opacity: 0.12; filter: blur(46px); transform: rotate(-32deg); top: -160px; right: -40px"></div>
    <div style="position: absolute; width: 300px; height: 200px; border-radius: 150px; background: #0E7C74; opacity: 0.3; filter: blur(70px); bottom: -60px; left: 45px"></div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <button aria-label="Switch venue" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 6px; border-radius: 26px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #FFFFFF; cursor: pointer; text-align: left">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0C1F1D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">DA</span>
          <span style="display: flex; flex-direction: column">
            <span style="display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 800">Demo Arena
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </span>
            <span style="font-size: 12px; color: #FFFFFF">2 courts · Padel</span>
          </span>
        </button>
        <button aria-label="Notifications, 4 new" style="position: relative; width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
          <span style="position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF6A2B; color: #0C1F1D; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box">4</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <button aria-label="Previous day" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 14px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.06em">AAJ · SAT, 24 OCT</span>
        <button aria-label="Next day" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: #FFFFFF">
        <span style="font-size: 14px; font-weight: 700; color: #FFFFFF">Aaj aaya</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 50px; line-height: 1; font-weight: 800; letter-spacing: -0.035em">PKR 7,000</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
          <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); font-size: 13px; font-weight: 700; display: flex; align-items: center">6 bookings</span>
          <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); font-size: 13px; font-weight: 700; display: flex; align-items: center">5 ghante khaali</span>
          <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); font-size: 13px; font-weight: 700; display: flex; align-items: center">PKR 1,250 baqi</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position: relative; margin-top: -28px; background: #F4F6F5; border-radius: 30px 30px 0 0; padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="Approvals.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 14px; text-decoration: none; color: #0C1F1D; box-shadow: 0 10px 26px rgba(14,26,29,0.07)">
      <span style="width: 48px; height: 48px; border-radius: 16px; background: #FFF1D6; color: #8A5A00; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; flex: none">3</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">Payments check karni hain</span>
        <span style="font-size: 13px; color: #8A5A00">Sab se purani 12 min se wait</span>
      </span>
      <span style="flex: none; height: 40px; padding: 0 14px; border-radius: 14px; background: #0E7C74; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center">Dekhein</span>
    </a>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 4px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Courts ka din</h2>
      <span style="font-size: 13px; color: #4A5D5A">5 PM – 11 PM</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 26px; padding: 12px 10px 14px 0; box-shadow: 0 10px 26px rgba(14,26,29,0.06)">
      <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding-bottom: 8px">
        <span></span>
        <span style="font-size: 13px; font-weight: 800; text-align: center">Court 1</span>
        <span style="font-size: 13px; font-weight: 800; text-align: center">Court 2</span>
      </div>
      <div style="position: relative; height: 432px; display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
        <div style="position: relative">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
            <span style="position: absolute; right: 8px; top: {{h.top}}px; font-size: 11px; font-weight: 700; color: #4A5D5A">{{h.label}}</span>
          </sc-for>
        </div>
        <div style="position: relative; background-image: repeating-linear-gradient(to bottom, #F4F6F5 0, #F4F6F5 1px, transparent 1px, transparent 72px)">
          <sc-for list="{{court1}}" as="b" hint-placeholder-count="4">
            <button style="{{b.style}}">
              <span style="font-size: 13px; font-weight: 800; line-height: 1.2">{{b.name}}</span>
              <span style="font-size: 11px; font-weight: 600; line-height: 1.25">{{b.meta}}</span>
            </button>
          </sc-for>
        </div>
        <div style="position: relative; background-image: repeating-linear-gradient(to bottom, #F4F6F5 0, #F4F6F5 1px, transparent 1px, transparent 72px)">
          <sc-for list="{{court2}}" as="b" hint-placeholder-count="4">
            <button style="{{b.style}}">
              <span style="font-size: 13px; font-weight: 800; line-height: 1.2">{{b.name}}</span>
              <span style="font-size: 11px; font-weight: 600; line-height: 1.25">{{b.meta}}</span>
            </button>
          </sc-for>
        </div>
        <div style="position: absolute; left: 44px; right: 0; top: 120px; display: flex; align-items: center; pointer-events: none">
          <span style="background: #FF6A2B; color: #0C1F1D; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 6px">6:40</span>
          <span style="flex: 1; height: 2px; background: #FF6A2B"></span>
        </div>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 0 0 14px; font-size: 12px; color: #3B4B48">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0E7C74"></span>Booked</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FFF1D6; border: 1px solid #FFB020"></span>Check baqi</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E3F4F1"></span>Walk-in</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; border: 1px dashed #5B6E6B"></span>Khaali</span>
      </div>
    </div>

    <button style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 0; border-radius: 18px; padding: 10px 12px; color: #0C1F1D; cursor: pointer; text-align: left; min-height: 50px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16a3 3 0 0 1 6 0M15 10h3M15 14h3"></path></svg>
      <span style="flex: 1; font-size: 14px"><b>CNIC verify karein</b> <span style="color: #4A5D5A">· payout ke liye, 1 minute</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5D5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
  </div>

  <nav aria-label="Owner" style="position: absolute; left: 14px; right: 14px; bottom: 22px; height: 72px; border-radius: 26px; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 16px 40px rgba(14,26,29,0.18); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px; box-sizing: border-box">
    <a href="#" style="height: 58px; border-radius: 20px; background: #0E7C74; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 800; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Aaj
    </a>
    <a href="Approvals.dc.html" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #3B4B48">
      <span style="position: relative; display: flex">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span style="position: absolute; top: -5px; right: -10px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF6A2B; color: #0C1F1D; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>
      </span>Approvals
    </a>
    <div style="display: flex; justify-content: center">
      <button aria-label="Add walk-in booking" style="width: 52px; height: 52px; border-radius: 18px; background: #0E7C74; color: #FFFFFF; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 18px rgba(14,124,116,0.4)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <a href="#" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #3B4B48">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"></path><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"></path><circle cx="16" cy="14.5" r="1.2"></circle></svg>Paisa
    </a>
    <a href="OwnerMore.dc.html" style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #3B4B48">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>Aur
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const px = 72;
    const top = (h, m) => ((h - 17) * 60 + m) / 60 * px;
    const block = (sh, sm, eh, em, kind, name, meta) => {
      const t = top(sh, sm) + 2;
      const hgt = top(eh, em) - top(sh, sm) - 4;
      let st = 'position: absolute; left: 0; right: 0; top: ' + t + 'px; height: ' + hgt + 'px; border-radius: 12px; padding: 7px 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; overflow: hidden; text-align: left; cursor: pointer; ';
      if (kind === 'booked') st += 'background: #0E7C74; color: #FFFFFF; border: 0;';
      if (kind === 'pending') st += 'background: #FFF1D6; color: #8A5A00; border: 1px solid #FFB020;';
      if (kind === 'walkin') st += 'background: #E3F4F1; color: #0C1F1D; border: 0;';
      if (kind === 'free') st += 'background: transparent; color: #3B4B48; border: 1px dashed #5B6E6B; justify-content: center; align-items: center; text-align: center;';
      return { name, meta, style: st };
    };
    const hours = ['5 PM', '6 PM', '7 PM', '8 PM', '9 PM', '10 PM'].map((label, i) => ({ label, top: i === 0 ? 0 : i * px - 6 }));
    return {
      hours,
      court1: [
        block(17, 0, 18, 0, 'walkin', 'Ahmed', 'Walk-in · Paid'),
        block(18, 0, 19, 0, 'free', '+ Add', '1 hr khaali'),
        block(19, 0, 20, 0, 'booked', 'Demo Player', 'PKR 2,000 paid'),
        block(20, 0, 21, 0, 'pending', 'Fresh Player', 'Check baqi'),
        block(21, 30, 23, 0, 'booked', 'Usman K.', '1.5 hr · Paid')
      ],
      court2: [
        block(17, 0, 18, 0, 'free', '+ Add', '1 hr khaali'),
        block(18, 0, 19, 30, 'booked', 'Bilal', 'PKR 1,250 venue par'),
        block(19, 30, 21, 0, 'free', '+ Add', '1.5 hr khaali'),
        block(21, 0, 22, 0, 'pending', 'Ali Raza', 'Check baqi'),
        block(22, 0, 23, 0, 'free', '+ Add', '1 hr khaali')
      ]
    };
  }
}
</script>
</body>
</html>
