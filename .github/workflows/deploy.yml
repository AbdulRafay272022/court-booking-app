name: Build, push, deploy

# Runs on every push to main: builds both images, pushes them to ECR, then
# (once EC2_HOST/EC2_SSH_KEY are configured -- see the "deploy" job's
# guard) pulls and restarts them on the EC2 instance over SSH. The instance
# itself never runs `docker build` -- a t3.micro's 1GB RAM isn't reliably
# enough to build a Next.js app or the Python dependency set without
# risking an OOM kill mid-build. Until the EC2 secrets exist, this
# workflow still fully builds and pushes real images to ECR on every push
# -- only the final restart step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC -- see infra/oidc.tf. No AWS access keys stored anywhere.
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: court-booking-backend
          file: court-booking-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          # Build context is the frontend WORKSPACE ROOT, not apps/web --
          # this is an npm workspaces monorepo (apps/web depends on
          # packages/types and packages/api-client), so `npm ci` needs the
          # root package.json/package-lock.json in scope. See the comment
          # at the top of apps/web/Dockerfile.
          context: court-booking-frontend
          file: court-booking-frontend/apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-web:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/court-booking-app-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 deploy secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2_HOST/EC2_SSH_KEY secrets are not set yet -- images were built and pushed to ECR, but the restart-on-EC2 step is skipped until the instance exists (see infra/, a later part of the deployment setup). Nothing to fix here; this is expected until then."
          fi

      - name: Pull and restart on EC2
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # The instance authenticates to ECR itself via its own IAM
          # instance profile (see infra's later EC2 setup) -- `aws ecr
          # get-login-password` needs no credentials passed over SSH.
          script: |
            set -euo pipefail
            cd /opt/court-booking-app
            export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
