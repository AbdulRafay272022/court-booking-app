<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin:0; font-family:'Figtree','Segoe UI',system-ui,sans-serif; }
    a { color:#EF5A2C; } a:hover { color:#C8431C; }
    * { box-sizing:border-box; }</style></head><body><div style="width:390px; height:844px; background:#FAF8F6; color:#141A1D; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:26px 20px 0;">
    <div style="width:44px; height:44px; border-radius:12px; background:#FFFFFF; border:1px solid #EBE5E1; display:flex; align-items:center; justify-content:center;">

    </div>
  </div>

  <div style="flex-grow:1; padding:30px 26px 0; display:flex; flex-direction:column; gap:30px;">

    <div style="display:flex; flex-direction:column; gap:11px;">
      <span style="font-size:28px; font-weight:800; letter-spacing:-0.032em;">Enter your code</span>
      <span style="font-size:16px; color:#5C544D; font-weight:500; line-height:1.5;">Six digits, sent to <span style="font-family:'IBM Plex Mono',monospace; font-weight:600; color:#141A1D;">+92 300 4408817</span></span>
    </div>

    <div style="display:flex; gap:9px;">
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1px solid #E5DED8; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600;">4</div>
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1px solid #E5DED8; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600;">1</div>
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1px solid #E5DED8; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600;">8</div>
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1px solid #E5DED8; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600;">2</div>
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1.5px solid #EF5A2C; display:flex; align-items:center; justify-content:center;">
        <div style="width:2px; height:26px; background:#EF5A2C;"></div>
      </div>
      <div style="flex-grow:1; height:64px; border-radius:13px; background:#FFFFFF; border:1px solid #E5DED8;"></div>
    </div>

    <div style="background:#E4F0EA; border:1px solid #A9CFBD; border-radius:14px; padding:15px; display:flex; align-items:center; gap:12px;">
      <div style="width:36px; height:36px; border-radius:999px; background:#1F7A52; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-4-1L3 21l2.1-5a8.4 8.4 0 01-1-4 8.5 8.5 0 018.5-8.4 8.4 8.4 0 018.4 8.4z"></path></svg>
      </div>
      <span style="font-size:13.5px; color:#14563A; font-weight:600; line-height:1.45; flex-grow:1;">Check WhatsApp — the code is in your chat with Maidan</span>
    </div>

    <div style="height:58px; border-radius:14px; background:#EF5A2C; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:16.5px; font-weight:700;">Verify</div>

    <div style="display:flex; flex-direction:column; gap:16px; align-items:center;">
      <span style="font-size:14px; color:#9A9791; font-weight:500;">Resend in <span style="font-family:'IBM Plex Mono',monospace; font-weight:600; color:#5C544D;">0:24</span></span>
      <div style="min-height:44px; padding:0 18px; display:flex; align-items:center; gap:8px; border-radius:999px; border:1px solid #E0D9D4;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C544D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
        <span style="font-size:14px; font-weight:600; color:#5C544D;">Send by SMS instead</span>

    </div>
  </div>

  <div style="padding:0 26px 30px; display:flex; justify-content:center;">
    <div style="min-height:44px; padding:0 16px; display:flex; align-items:center; gap:6px;">
      <span style="font-size:13.5px; color:#9A9791; font-weight:500;">Wrong number?</span>
      <span style="font-size:13.5px; color:#5C544D; font-weight:700; text-decoration:underline;">Change it</span>
    </div>
  </div>
</div></body></html>
